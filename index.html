<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Đăng nhập · Share Studio Pro VN</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#18212f;background:#eef3fa}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}
main{min-height:100dvh;display:grid;place-items:center;padding:20px}
section{width:min(100%,440px);background:white;border:1px solid #d9e4f1;border-radius:20px;padding:clamp(24px,5vw,42px);box-shadow:0 20px 65px #1d37631a}
h1{margin:6px 0 8px;font-size:clamp(24px,5vw,32px);line-height:1.2}
.brand{font-weight:750;color:#2454a3;margin:0}p{margin:12px 0;color:#49586c}
label{display:block;margin:16px 0 6px;font-weight:600}
input,button{font:inherit;border-radius:9px;padding:10px 14px}
input{width:100%;border:1px solid #a8b7ca}button{border:0;background:#184ba0;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.55}
form button{width:100%;margin-top:18px}.secondary{color:#184ba0;background:transparent;text-decoration:underline;padding-left:0}
:focus-visible{outline:3px solid #487de5;outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:white;border-bottom:1px solid #d9e4f1;gap:8px}
iframe{display:block;border:0;width:100%;height:calc(100dvh - 61px)}
#status{min-height:1.5em}
</style>
<main id="gate">
<section aria-labelledby="title">
<p class="brand">Share Studio Pro VN</p>
<h1 id="title">Đăng nhập</h1>
<p id="help">Dùng email đã được chủ ứng dụng cấp quyền.</p>
<form id="login">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Đăng nhập</button>
</form>
<form id="setup" hidden>
<label for="new-password">Mật khẩu mới</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
<button type="submit">Lưu mật khẩu</button>
</form>
<button id="recover" class="secondary" type="button">Quên mật khẩu</button>
<p id="status" role="status"></p>
<noscript>Cần bật JavaScript để đăng nhập.</noscript>
</section>
</main>
<header id="toolbar" hidden><strong>Share Studio Pro VN</strong><button id="logout" type="button">Đăng xuất</button></header>
<div id="content"></div>
<script>
'use strict';
const endpoint = 'https://jdwukaouelwetklkmbwr.supabase.co';
const publicKey = 'sb_publishable_9BLHUsssayzGtUtD5w4Y0Q_M1lVXidN';
const callback = location.origin + location.pathname;
const byId = id => document.getElementById(id);
const login = byId('login');
const setup = byId('setup');
const recovery = byId('recover');
let accessToken = '';
let resetToken = '';
let frameUrl = '';
let expiration;
let busy = false;

async function request(path, method = 'GET', body, token) {
  const headers = { apikey: publicKey };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (token) headers.Authorization = 'Bearer ' + token;
  return fetch(endpoint + path, {
    method, headers, body: body === undefined ? undefined : JSON.stringify(body),
    cache: 'no-store', credentials: 'omit', redirect: 'error', referrerPolicy: 'no-referrer',
    signal: AbortSignal.timeout(20000)
  });
}

function showLogin(message = '') {
  clearTimeout(expiration);
  byId('content').replaceChildren();
  if (frameUrl) URL.revokeObjectURL(frameUrl);
  frameUrl = '';
  accessToken = '';
  resetToken = '';
  byId('toolbar').hidden = true;
  byId('gate').hidden = false;
  setup.hidden = true;
  login.hidden = false;
  recovery.hidden = false;
  byId('title').textContent = 'Đăng nhập';
  byId('help').textContent = 'Dùng email đã được chủ ứng dụng cấp quyền.';
  byId('status').textContent = message;
}

async function finishSignIn(session) {
  const { access_token: token, expires_in: lifetime } = session;
  const userId = session.user?.id;
  if (!token || !Number.isFinite(lifetime) || lifetime <= 0 ||
      typeof userId !== 'string' || !/^[0-9a-f-]{36}$/i.test(userId)) {
    throw new Error('invalid session');
  }
  const response = await request('/storage/v1/object/authenticated/share-studio-private/studio.html',
    'GET', undefined, token);
  if (!response.ok) {
    if ([400, 401, 403, 404].includes(response.status)) {
      showLogin('Tài khoản này chưa được cấp quyền truy cập ứng dụng.');
      return;
    }
    throw new Error('unavailable');
  }
  const app = (await response.text())
    .replace("'share-studio-pro-posts-v1'", "'share-studio-pro-posts-v1:" + userId + "'")
    .replace("'share-studio-pro-channel-links-v1'", "'share-studio-pro-channel-links-v1:" + userId + "'")
    .replace("'share-studio-pro-media'", "'share-studio-pro-media:" + userId + "'")
    .replaceAll("location.pathname + location.search", "location.href.split('#')[0]");
  if (!app.startsWith('<!doctype html>')) throw new Error('invalid application');
  const frame = document.createElement('iframe');
  frame.title = 'Không gian làm việc Share Studio Pro VN';
  frame.allow = 'clipboard-write';
  frameUrl = URL.createObjectURL(new Blob([app], { type: 'text/html;charset=utf-8' }));
  frame.src = frameUrl;
  accessToken = token;
  byId('content').replaceChildren(frame);
  byId('gate').hidden = true;
  byId('toolbar').hidden = false;
  expiration = setTimeout(() => showLogin('Phiên đã hết hạn. Vui lòng đăng nhập lại.'), lifetime * 1000);
}

async function run(button, action) {
  if (busy) return;
  busy = true;
  button.disabled = true;
  byId('status').textContent = 'Đang xử lý…';
  try {
    byId('status').textContent = await action() ?? '';
  } catch {
    byId('status').textContent = 'Chưa kết nối được. Vui lòng thử lại.';
  } finally {
    button.disabled = false;
    busy = false;
  }
}

login.addEventListener('submit', event => {
  event.preventDefault();
  const email = byId('email').value.trim();
  const password = byId('password').value;
  byId('password').value = '';
  run(event.submitter, async () => {
    const result = await request('/auth/v1/token?grant_type=password', 'POST', {email, password});
    if (result.status === 429) return 'Em đã thử nhiều lần. Vui lòng đợi rồi thử lại.';
    if ([400, 401, 403, 422].includes(result.status)) return 'Email hoặc mật khẩu chưa đúng.';
    if (!result.ok) throw new Error('unavailable');
    await finishSignIn(await result.json());
    return byId('status').textContent === 'Đang xử lý…' ? '' : byId('status').textContent;
  });
});

recovery.addEventListener('click', () => {
  if (!byId('email').reportValidity()) return;
  run(recovery, async () => {
    const result = await request('/auth/v1/recover?redirect_to=' + encodeURIComponent(callback),
      'POST', {email: byId('email').value.trim()});
    if (result.status === 429) return 'Vui lòng đợi rồi thử lại.';
    if (!result.ok && result.status >= 500) throw new Error('unavailable');
    return 'Nếu email đủ điều kiện, em sẽ nhận được liên kết đặt lại mật khẩu.';
  });
});

setup.addEventListener('submit', event => {
  event.preventDefault();
  if (!resetToken) return;
  const password = byId('new-password').value;
  byId('new-password').value = '';
  run(event.submitter, async () => {
    const result = await request('/auth/v1/user', 'PUT', {password}, resetToken);
    if (!result.ok) return 'Chưa lưu được mật khẩu. Hãy kiểm tra mật khẩu hoặc dùng lại liên kết mới.';
    await request('/auth/v1/logout?scope=local', 'POST', undefined, resetToken).catch(() => {});
    showLogin('Đã lưu mật khẩu. Em có thể đăng nhập.');
    return 'Đã lưu mật khẩu. Em có thể đăng nhập.';
  });
});

byId('logout').addEventListener('click', () => {
  const token = accessToken;
  showLogin('Đã đăng xuất trên tab này.');
  if (token) request('/auth/v1/logout?scope=local', 'POST', undefined, token).catch(() => {});
});

(async () => {
  const params = new URLSearchParams(location.hash.slice(1));
  if (!params.has('access_token') && !params.has('error')) return;
  history.replaceState(null, '', location.pathname);
  const token = params.get('access_token');
  if (!token || !['invite', 'recovery'].includes(params.get('type'))) {
    showLogin('Liên kết đã hết hạn hoặc không hợp lệ.');
    return;
  }
  try {
    const result = await request('/auth/v1/user', 'GET', undefined, token);
    if (!result.ok) throw new Error('invalid link');
    resetToken = token;
    byId('title').textContent = 'Đặt mật khẩu';
    byId('help').textContent = 'Chọn mật khẩu ít nhất 12 ký tự.';
    login.hidden = true;
    recovery.hidden = true;
    setup.hidden = false;
  } catch {
    showLogin('Chưa xác minh được liên kết. Vui lòng thử lại bằng liên kết mới.');
  }
})();
</script>
</html>
